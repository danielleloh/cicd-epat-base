name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Unit Testing with Maven
      run: mvn test

  snyk-security:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run Snyk security scan
      uses: snyk/actions/maven-3-jdk-21@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --sarif-file-output=snyk.sarif

  docker-build:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t d13revision:${{ github.sha }} .

      - name: Save Docker image artifact
        run: docker save -o d13revision-${{ github.sha }}.tar d13revision:${{ github.sha }}

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: d13revision-image
          path: d13revision-${{ github.sha }}.tar

  trivy-scan:
    needs: docker-build
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: d13revision:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

  docker-push:
    needs: [docker-build, trivy-scan]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: d13revision-image

      - name: Load Docker image
        run: docker load -i d13revision-${{ github.sha }}.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag d13revision:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/d13revision:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/d13revision:${{ github.sha }}

  notify-telegram:
    needs: [snyk-security, docker-push]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Snyk security scan finished for ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Status: ${{ needs.snyk-security.result }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
